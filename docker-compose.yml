services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymvault}
      POSTGRES_DB: ${POSTGRES_DB:-gymvault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gymvault_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymvault}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  gymvault_pgdata:
  redis-data:
