name: opengymvault

services:
  migrate:
    build: .
    entrypoint: ["/migrate"]
    command: ["up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://opengymvault:${POSTGRES_PASSWORD:-opengymvault}@postgres:5432/${POSTGRES_DB:-opengymvault}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://opengymvault:${POSTGRES_PASSWORD:-opengymvault}@postgres:5432/${POSTGRES_DB:-opengymvault}?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: ":8080"
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-5}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opengymvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opengymvault}
      POSTGRES_DB: ${POSTGRES_DB:-opengymvault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opengymvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redis-data:
